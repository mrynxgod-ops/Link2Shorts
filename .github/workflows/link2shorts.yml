name: Link2Shorts

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: Public video URL you own or are authorized to reuse
        required: true
        type: string
      clip_count:
        description: Number of Shorts to generate (1-8)
        required: true
        default: "3"
        type: string
      whisper_model:
        description: Speech recognition model
        required: true
        default: base
        type: choice
        options:
          - tiny
          - base
          - small

permissions:
  contents: read

concurrency:
  group: link2shorts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  make-shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Configure optional YouTube cookies
        if: ${{ secrets.YOUTUBE_COOKIES_BASE64 != '' }}
        env:
          YOUTUBE_COOKIES_BASE64: ${{ secrets.YOUTUBE_COOKIES_BASE64 }}
        run: |
          mkdir -p work
          printf '%s' "$YOUTUBE_COOKIES_BASE64" | base64 --decode > work/youtube-cookies.txt
          chmod 600 work/youtube-cookies.txt
      - name: Generate Shorts
        env:
          VIDEO_URL: ${{ inputs.video_url }}
          CLIP_COUNT: ${{ inputs.clip_count }}
          WHISPER_MODEL: ${{ inputs.whisper_model }}
        run: python clipper.py --url "$VIDEO_URL" --count "$CLIP_COUNT" --model "$WHISPER_MODEL"
      - name: Upload generated clips
        uses: actions/upload-artifact@v4
        with:
          name: link2shorts-clips
          path: output/
          if-no-files-found: error
          retention-days: 7
